[package]
name = "kanal"
version = "0.2.0-beta1"
edition = "2021"
authors = ["Khashayar Fereidani"]
description = "The fast sync and async channel that Rust deserves"
repository = "https://github.com/fereidani/kanal"
documentation = "https://docs.rs/kanal"
keywords = ["channel", "mpsc", "mpmc", "async"]
categories = ["concurrency", "data-structures", "asynchronous"]
license = "MIT"
readme = "README.md"

[dependencies]
branches = "0.4"
cacheguard = "0.1"
futures-core = { version = "0.3", optional = true }
lock_api = "0.4"

# Runtime timers and runtime crates are only needed by real (non-loom) builds.
# Keeping them out of the loom dependency graph also keeps the global
# `RUSTFLAGS="--cfg loom"` from leaking into third-party crates that contain
# their own `cfg(loom)` code.
[target.'cfg(not(loom))'.dependencies]
# Runtime-agnostic async timer used when no (or more than one) runtime
# backend feature is selected. See src/async_backoff.rs.
futures-timer = { version = "3", optional = true }
# Exactly one of these is picked up by `async-tokio`, `async-smol` and
# `async-compio` to sleep through the native runtime timer.
compio = { version = "0.19", optional = true, default-features = false, features = ["runtime", "time", "polling"] }
# Makes `compio`'s thread-affine `TimerFuture` storable inside the `Send`
# async futures (see src/async_backoff.rs).
compio-send-wrapper = { version = "0.7", optional = true, features = [
    "futures",
] }
smol = { version = "2", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "time"] }

[dev-dependencies]
anyhow = "1.0"
criterion = "0.8"
crossbeam = "0.8"
futures = "0.3"

[target.'cfg(not(loom))'.dev-dependencies]
# `polling` lets the Linux fusion driver fall back to poll when io_uring is
# unavailable (for example inside restricted CI containers).
compio = { version = "0.19", features = ["macros", "time", "polling"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros"] }

# Model checker for concurrent code, active only with RUSTFLAGS="--cfg loom".
# See tests/loom.rs for how to run the loom test suite.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
async = ["futures-core", "dep:futures-timer"]
# Native async timers used by the async backoff. Enable at most one; if none
# or several are enabled, the runtime-agnostic `futures-timer` fallback is
# used instead.
async-tokio = ["async", "dep:tokio"]
async-smol = ["async", "dep:smol"]
async-compio = ["async", "dep:compio", "dep:compio-send-wrapper"]
std-mutex = []
default = ["async"]

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "async"
harness = false
